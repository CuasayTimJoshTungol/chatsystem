<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>NullLink · Mutual Handshake Chat</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* ---------- DESIGN SYSTEM (unchanged UI) ---------- */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        :root {
            --bg: #0a0a0f;
            --bg2: #111118;
            --bg3: #18181f;
            --bg4: #1e1e28;
            --border: rgba(255, 255, 255, 0.07);
            --border2: rgba(255, 255, 255, 0.12);
            --accent: #7c6fff;
            --accent-dim: rgba(124, 111, 255, 0.15);
            --accent-dim2: rgba(124, 111, 255, 0.08);
            --text: #f0eeff;
            --text2: #9896b0;
            --text3: #5a5870;
            --green: #4ade80;
            --green-dim: rgba(74, 222, 128, 0.12);
            --red: #f87171;
            --amber: #fbbf24;
            --mono: 'DM Mono', monospace;
            --sans: 'Syne', sans-serif;
        }
        body {
            font-family: var(--sans);
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        #entry {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: var(--bg);
            position: relative;
            overflow: hidden;
        }
        #entry::before {
            content: '';
            position: absolute;
            top: -200px;
            left: 50%;
            transform: translateX(-50%);
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(124, 111, 255, 0.08) 0%, transparent 70%);
            pointer-events: none;
        }
        .entry-logo {
            font-size: 11px;
            font-family: var(--mono);
            color: var(--text3);
            letter-spacing: 0.3em;
            text-transform: uppercase;
            margin-bottom: 40px;
        }
        .entry-card {
            background: var(--bg2);
            border: 0.5px solid var(--border2);
            border-radius: 20px;
            padding: 40px;
            width: 380px;
            position: relative;
        }
        .entry-my-id {
            background: var(--bg3);
            border: 0.5px solid var(--border2);
            border-radius: 12px;
            padding: 16px 20px;
            margin-bottom: 16px;
        }
        .entry-my-id label {
            font-size: 10px;
            font-family: var(--mono);
            color: var(--text3);
            letter-spacing: 0.2em;
            text-transform: uppercase;
            display: block;
            margin-bottom: 8px;
        }
        .entry-my-id .id-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 8px;
        }
        .id-value {
            font-family: var(--mono);
            font-size: 20px;
            font-weight: 500;
            color: var(--accent);
            letter-spacing: 0.1em;
        }
        .copy-btn {
            background: var(--accent-dim2);
            border: 0.5px solid var(--border2);
            border-radius: 8px;
            padding: 6px 10px;
            cursor: pointer;
            font-size: 10px;
            font-family: var(--mono);
            color: var(--text2);
            letter-spacing: 0.1em;
            transition: all 0.15s;
        }
        .copy-btn:hover {
            background: var(--accent-dim);
            color: var(--accent);
            border-color: var(--accent);
        }
        /* new styles for generate id and display name */
        .gen-id-btn {
            background: var(--accent-dim2);
            border: 0.5px solid var(--border2);
            border-radius: 8px;
            padding: 6px 10px;
            cursor: pointer;
            font-size: 10px;
            font-family: var(--mono);
            color: var(--text2);
            letter-spacing: 0.1em;
            transition: all 0.15s;
        }
        .gen-id-btn:hover {
            background: var(--accent-dim);
            color: var(--accent);
            border-color: var(--accent);
        }
        .display-name-row {
            background: var(--bg4);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 16px;
            border: 0.5px solid var(--border2);
        }
        .display-name-label {
            font-size: 9px;
            font-family: var(--mono);
            color: var(--text3);
            letter-spacing: 0.1em;
            text-transform: uppercase;
            margin-bottom: 6px;
        }
        .display-name-input {
            width: 100%;
            background: var(--bg3);
            border: 0.5px solid var(--border2);
            border-radius: 8px;
            padding: 8px 12px;
            font-family: var(--sans);
            font-size: 13px;
            color: var(--text);
            outline: none;
        }
        .display-name-input:focus {
            border-color: var(--accent);
        }
        .sidebar-display-name {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg4);
            border-radius: 8px;
            padding: 6px 10px;
            margin-top: 8px;
        }
        .sidebar-display-name span {
            font-size: 11px;
            font-family: var(--sans);
            color: var(--text2);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .edit-name-icon {
            cursor: pointer;
            font-size: 12px;
            background: none;
            border: none;
            color: var(--text3);
            font-family: var(--mono);
        }
        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
        }
        .divider span {
            font-size: 10px;
            font-family: var(--mono);
            color: var(--text3);
            letter-spacing: 0.15em;
        }
        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 0.5px;
            background: var(--border);
        }
        .connect-input {
            width: 100%;
            background: var(--bg3);
            border: 0.5px solid var(--border2);
            border-radius: 10px;
            padding: 14px 16px;
            font-family: var(--mono);
            font-size: 16px;
            color: var(--text);
            outline: none;
            letter-spacing: 0.1em;
            margin-bottom: 14px;
            transition: border-color 0.15s;
        }
        .connect-input::placeholder {
            color: var(--text3);
        }
        .connect-input:focus {
            border-color: var(--accent);
        }
        .connect-btn {
            width: 100%;
            background: var(--accent);
            border: none;
            border-radius: 10px;
            padding: 14px;
            font-family: var(--sans);
            font-size: 15px;
            font-weight: 600;
            color: white;
            cursor: pointer;
            letter-spacing: 0.02em;
            transition: all 0.15s;
        }
        .connect-btn:hover {
            background: #8d7fff;
            transform: translateY(-1px);
        }
        .history-btn {
            width: 100%;
            background: transparent;
            border: 0.5px solid var(--border2);
            border-radius: 10px;
            padding: 12px;
            font-family: var(--sans);
            font-size: 14px;
            font-weight: 500;
            color: var(--text2);
            cursor: pointer;
            letter-spacing: 0.02em;
            transition: all 0.15s;
            margin-top: 12px;
        }
        .history-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: var(--accent-dim2);
        }
        .status-dot-row {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 20px;
            justify-content: center;
        }
        .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--green);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
        #app {
            display: none;
            height: 100vh;
            flex-direction: row;
            background: var(--bg);
        }
        #sidebar {
            width: 260px;
            min-width: 260px;
            background: var(--bg2);
            border-right: 0.5px solid var(--border);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        .sidebar-header {
            padding: 20px 16px 14px;
            border-bottom: 0.5px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .sidebar-brand {
            font-size: 11px;
            font-family: var(--mono);
            color: var(--text3);
            letter-spacing: 0.25em;
            text-transform: uppercase;
        }
        .sidebar-my-id {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--accent-dim2);
            border: 0.5px solid rgba(124, 111, 255, 0.2);
            border-radius: 8px;
            padding: 8px 10px;
        }
        .sidebar-my-id .mid {
            font-family: var(--mono);
            font-size: 13px;
            font-weight: 500;
            color: var(--accent);
            letter-spacing: 0.05em;
        }
        .sidebar-new-btn {
            width: 100%;
            background: transparent;
            border: 0.5px dashed var(--border2);
            border-radius: 8px;
            padding: 8px 12px;
            font-family: var(--mono);
            font-size: 11px;
            color: var(--text3);
            cursor: pointer;
            letter-spacing: 0.1em;
            transition: all 0.15s;
        }
        .sidebar-new-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: var(--accent-dim2);
        }
        .convos-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }
        .convo-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.12s;
            border: 0.5px solid transparent;
        }
        .convo-item:hover {
            background: var(--bg3);
        }
        .convo-item.active {
            background: var(--accent-dim);
            border-color: rgba(124, 111, 255, 0.25);
        }
        .convo-avatar {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: var(--bg4);
            border: 0.5px solid var(--border2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--mono);
            font-size: 11px;
            font-weight: 500;
            color: var(--text2);
            flex-shrink: 0;
            position: relative;
        }
        .status-pip {
            position: absolute;
            bottom: -2px;
            right: -2px;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            border: 1.5px solid var(--bg2);
        }
        .pip-online { background: var(--green); }
        .pip-offline { background: var(--text3); }
        .convo-info {
            flex: 1;
            min-width: 0;
        }
        .convo-id {
            font-family: var(--mono);
            font-size: 12px;
            font-weight: 500;
            color: var(--text);
            letter-spacing: 0.05em;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .convo-preview {
            font-size: 11px;
            color: var(--text3);
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .convo-meta {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
        }
        .convo-time {
            font-size: 10px;
            font-family: var(--mono);
            color: var(--text3);
        }
        .unread-badge {
            background: var(--accent);
            color: white;
            font-size: 10px;
            font-family: var(--mono);
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #main {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        .chat-header {
            padding: 14px 20px;
            border-bottom: 0.5px solid var(--border);
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--bg2);
        }
        .chat-header-avatar {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: var(--bg4);
            border: 0.5px solid var(--border2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--mono);
            font-size: 11px;
            font-weight: 500;
            color: var(--text2);
            flex-shrink: 0;
            position: relative;
        }
        .chat-header-info {
            flex: 1;
        }
        .chat-header-id {
            font-family: var(--mono);
            font-size: 14px;
            font-weight: 500;
            color: var(--text);
            letter-spacing: 0.05em;
        }
        .chat-header-status {
            font-size: 11px;
            font-family: var(--mono);
            margin-top: 1px;
        }
        .icon-btn {
            background: var(--bg3);
            border: 0.5px solid var(--border);
            border-radius: 8px;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text2);
            font-size: 14px;
            transition: all 0.12s;
        }
        .icon-btn:hover {
            border-color: var(--border2);
            color: var(--text);
        }
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px 24px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            scroll-behavior: smooth;
        }
        .messages::-webkit-scrollbar { width: 4px; }
        .day-label {
            text-align: center;
            font-size: 10px;
            font-family: var(--mono);
            color: var(--text3);
            letter-spacing: 0.15em;
            text-transform: uppercase;
            margin: 16px 0 8px;
        }
        .msg-row {
            display: flex;
            gap: 8px;
            max-width: 100%;
        }
        .msg-row.out { flex-direction: row-reverse; }
        .msg-row.in { flex-direction: row; }
        .msg-bubble {
            max-width: 100%;
            padding: 10px 14px;
            border-radius: 14px;
            font-size: 14px;
            line-height: 1.5;
            word-break: break-word;
        }
        .msg-row.out .msg-bubble {
            background: var(--accent);
            color: white;
            border-bottom-right-radius: 4px;
        }
        .msg-row.in .msg-bubble {
            background: var(--bg3);
            border: 0.5px solid var(--border);
            color: var(--text);
            border-bottom-left-radius: 4px;
        }
        .msg-meta {
            display: flex;
            align-items: center;
            gap: 4px;
            margin-top: 3px;
            font-size: 9px;
            font-family: var(--mono);
            color: var(--text3);
        }
        .msg-row.out .msg-meta { justify-content: flex-end; }
        .msg-row.in .msg-meta { justify-content: flex-start; }
        .input-area {
            padding: 12px 20px 16px;
            border-top: 0.5px solid var(--border);
            background: var(--bg2);
            display: flex;
            align-items: flex-end;
            gap: 10px;
        }
        .input-wrap {
            flex: 1;
            background: var(--bg3);
            border: 0.5px solid var(--border2);
            border-radius: 14px;
            display: flex;
            align-items: flex-end;
            gap: 8px;
            padding: 10px 14px;
            transition: border-color 0.15s;
        }
        .input-wrap:focus-within {
            border-color: var(--accent);
        }
        .msg-input {
            flex: 1;
            background: none;
            border: none;
            outline: none;
            font-family: var(--sans);
            font-size: 14px;
            color: var(--text);
            resize: none;
            line-height: 1.5;
            max-height: 100px;
            overflow-y: auto;
            padding: 0;
        }
        .msg-input::placeholder { color: var(--text3); }
        /* FIX: Ensure message input field is always visible with correct background and text color */
        .input-wrap .msg-input {
            background: var(--bg3);
            color: var(--text);
            padding: 2px 0;
        }
        .send-btn {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: var(--accent);
            border: none;
            color: white;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
            flex-shrink: 0;
        }
        .send-btn:hover {
            background: #8d7fff;
            transform: scale(1.04);
        }
        #empty-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: var(--text3);
            font-family: var(--mono);
            font-size: 12px;
            letter-spacing: 0.1em;
        }
        #toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--bg4);
            border: 0.5px solid var(--border2);
            border-radius: 10px;
            padding: 10px 20px;
            font-family: var(--mono);
            font-size: 12px;
            color: var(--text2);
            opacity: 0;
            transition: all 0.2s;
            pointer-events: none;
            z-index: 99;
            letter-spacing: 0.05em;
        }
        #toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .action-pending {
            background: var(--amber);
            color: #0a0a0f;
            border-radius: 12px;
            padding: 6px 12px;
            font-size: 10px;
            font-family: var(--mono);
        }
        .accept-request-btn {
            background: var(--green-dim);
            border: 0.5px solid var(--green);
            color: var(--green);
            font-family: var(--mono);
            font-size: 10px;
            border-radius: 20px;
            padding: 4px 12px;
            cursor: pointer;
        }

        .entry-logo{
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        /* ---------- ADDED MOBILE RESPONSIVE DESIGN (no existing styles removed) ---------- */
        @media (max-width: 768px) {
            body {
                overflow-y: auto;
                height: auto;
            }
            #entry {
                height: auto;
                min-height: 100vh;
                padding: 20px 16px;
                justify-content: center;
            }
            .entry-card {
                width: 100%;
                max-width: 380px;
                padding: 28px 20px;
                margin: 0 auto;
            }
            .entry-my-id .id-row {
                flex-wrap: wrap;
                gap: 6px;
            }
            .id-value {
                font-size: 18px;
                word-break: break-all;
            }
            .connect-input, .connect-btn, .history-btn {
                font-size: 14px;
                padding: 12px;
            }
            #app {
                flex-direction: column;
                height: auto;
                min-height: 100vh;
            }
            #sidebar {
                width: 100%;
                min-width: unset;
                height: auto;
                max-height: 45vh;
                border-right: none;
                border-bottom: 0.5px solid var(--border);
            }
            .convos-list {
                max-height: calc(45vh - 120px);
                overflow-y: auto;
            }
            #main {
                height: 55vh;
                min-height: 300px;
            }
            .chat-header {
                padding: 12px 16px;
            }
            .chat-header-id {
                font-size: 13px;
            }
            .messages {
                padding: 16px;
            }
            .msg-bubble {
                font-size: 13px;
                padding: 8px 12px;
            }
            .input-area {
                padding: 10px 16px;
            }
            .input-wrap {
                padding: 8px 12px;
            }
            .msg-input {
                font-size: 14px;
            }
            .send-btn {
                width: 36px;
                height: 36px;
                font-size: 14px;
            }
            .convo-item {
                padding: 8px;
            }
            .convo-avatar {
                width: 32px;
                height: 32px;
                font-size: 10px;
            }
            .convo-id {
                font-size: 11px;
            }
            .convo-preview {
                font-size: 10px;
            }
            .sidebar-header {
                padding: 16px;
            }
            .sidebar-my-id .mid {
                font-size: 12px;
            }
            .sidebar-new-btn {
                font-size: 10px;
                padding: 6px 10px;
            }
            .sidebar-display-name span {
                font-size: 10px;
            }
            .status-dot-row {
                margin-top: 16px;
            }
            .toast {
                bottom: 16px;
                padding: 8px 16px;
                font-size: 11px;
            }
            .display-name-input {
                font-size: 12px;
                padding: 6px 10px;
            }
            .copy-btn, .gen-id-btn {
                padding: 4px 8px;
                font-size: 9px;
            }
            .entry-logo {
                font-size: 9px;
                margin-bottom: 20px;
                text-align: center;
                letter-spacing: 0.2em;
            }
        }

        @media (max-width: 480px) {
            .entry-card {
                padding: 20px 16px;
            }
            .entry-my-id {
                padding: 12px 16px;
            }
            .id-value {
                font-size: 16px;
            }
            .connect-input {
                font-size: 14px;
                padding: 10px 12px;
            }
            .connect-btn, .history-btn {
                font-size: 13px;
                padding: 10px;
            }
            .chat-header-id {
                font-size: 12px;
            }
            .chat-header-status {
                font-size: 9px;
            }
            .messages {
                padding: 12px;
            }
            .msg-bubble {
                font-size: 12px;
                padding: 6px 10px;
            }
            .input-area {
                gap: 6px;
            }
            .send-btn {
                width: 32px;
                height: 32px;
            }
            .sidebar-header {
                padding: 12px;
            }
            .convos-list {
                padding: 4px;
            }
            .convo-item {
                gap: 8px;
            }
        }
    </style>
</head>
<body>

<div id="entry">
    <div class="entry-logo">Share your ID with anyone. They enter it and you're connected instantly. No sign-up, no database — just peer-to-peer chat.</div>
    <div class="entry-card">
        <div class="entry-my-id">
            <label>your session id</label>
            <div class="id-row">
                <span class="id-value" id="my-id-display">connecting…</span>
                <button class="copy-btn" onclick="copyMyId()">COPY</button>
                <button class="gen-id-btn" onclick="generateNewId()">GENERATE NEW ID</button>
            </div>
        </div>
        <!-- Display name UI -->
        <div class="display-name-row">
            <div class="display-name-label">display name (optional)</div>
            <input type="text" id="display-name-input" class="display-name-input" placeholder="e.g. Alice, Bob..." maxlength="24">
            <button class="copy-btn" style="width:100%; margin-top:8px;" onclick="saveDisplayName()">save name</button>
        </div>
        <div class="divider"><span>mutual handshake</span></div>
        <input class="connect-input" id="connect-input" placeholder="Enter peer ID to request connection" maxlength="30">
        <button class="connect-btn" onclick="sendConnectionRequest()">Request Connection →</button>
        <button class="history-btn" onclick="restorePreviousConversations()">← go back to previous conversations</button>
        <div class="status-dot-row">
            <div class="dot" id="relay-dot"></div>
            <span id="relay-status-text">relay active · human-to-human only</span>
        </div>
    </div>
</div>



<div id="app">
    <div id="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-brand">NullLink</div>
            <div class="sidebar-my-id">
                <span style="font-size:10px;font-family:var(--mono);color:var(--text3);letter-spacing:0.1em;">MY ID</span>
                <span class="mid" id="sidebar-my-id">—</span>
                <button class="copy-btn" style="padding:4px 8px;font-size:9px;" onclick="copyMyId()">COPY</button>
            </div>
            <!-- Display name in sidebar -->
            <div class="sidebar-display-name" id="sidebar-display-name-container">
                <span id="sidebar-display-name-span">—</span>
                <button class="edit-name-icon" onclick="editDisplayNameFromSidebar()">✎</button>
            </div>
            <button class="sidebar-new-btn" onclick="openNewConnectionPrompt()">+ request connection</button>
        </div>
        <div class="convos-list" id="convos-list"></div>
    </div>
    <div id="main">
        <div id="empty-main">
            <div class="empty-icon">⌁</div>
            <div>no active chat</div>
            <div style="margin-top:4px;color:var(--text3)">request a handshake or accept pending invitations</div>
        </div>
        <div id="chat-panel" style="display:none;flex-direction:column;height:100%;overflow:hidden;">
            <div class="chat-header">
                <div class="chat-header-avatar" id="header-avatar"></div>
                <div class="chat-header-info">
                    <div class="chat-header-id" id="header-id">—</div>
                    <div class="chat-header-status" id="header-status"></div>
                </div>
                <div class="chat-header-actions">
                    <button class="icon-btn" onclick="goBack()">⌫</button>
                </div>
            </div>
            <div class="messages" id="messages"></div>
            <div class="input-area">
                <div class="input-wrap">
                    <textarea class="msg-input" id="msg-input" placeholder="Message …" rows="1" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage();}" oninput="autoResize(this)"></textarea>
                </div>
                <button class="send-btn" onclick="sendMessage()">↑</button>
            </div>
        </div>
    </div>
</div>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.2/dist/peerjs.min.js"></script>
<script>
    // ══════════════════════════════════════
    // MUTUAL HANDSHAKE CHAT — REAL PEER-TO-PEER VIA WEBRTC (PEERJS)
    // PERSISTENT CONVERSATIONS + AUTO-RECONNECTION FOR PREVIOUS CONTACTS
    // ══════════════════════════════════════════

    let myId = null;
    let peer = null;
    let activeConvoId = null;
    let sessions = {};
    let peerReady = false;
    let reconnectingFlags = {};  // avoid duplicate reconnection attempts

    // ── LocalStorage persistence helpers ──
    function saveSessionsToStorage() {
        const data = {};
        Object.keys(sessions).forEach(pid => {
            if (!sessions[pid]) return;
            const { conn, ...rest } = sessions[pid];
            data[pid] = rest;
        });
        localStorage.setItem('nullLink_sessions', JSON.stringify(data));
    }

    function loadSessionsFromStorage() {
        const raw = localStorage.getItem('nullLink_sessions');
        if (!raw) return;
        try {
            const data = JSON.parse(raw);
            Object.keys(data).forEach(pid => {
                sessions[pid] = data[pid];
                // Reset connection-related fields, but preserve 'established' flag and messages
                sessions[pid].online = false;
                sessions[pid].active = false;
                sessions[pid].conn = null;
                // ensure 'established' exists (if missing, derive from active or handshake)
                if (sessions[pid].established === undefined) {
                    sessions[pid].established = sessions[pid].active === true || (sessions[pid].messages && sessions[pid].messages.length > 0);
                }
            });
        } catch (e) {
            console.warn('Failed to load sessions from storage', e);
        }
    }

    // ── Generate short peer ID ──
    function generateShortId() {
        const chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
        let id = '';
        for (let i = 0; i < 8; i++) id += chars[Math.floor(Math.random() * chars.length)];
        return id;
    }

    function getOrCreatePeerId() {
        const stored = localStorage.getItem('nullLink_myPeerId');
        if (stored) return stored;
        const fresh = generateShortId();
        localStorage.setItem('nullLink_myPeerId', fresh);
        return fresh;
    }

    // NEW: generate brand new ID, reset everything
    function generateNewId() {
        if (!confirm("Generate a new ID? This will reset all conversations and you'll need to reconnect with your contacts. Your chat history for the current ID will be lost.")) return;
        // destroy current peer connection
        if (peer && !peer.destroyed) {
            peer.destroy();
        }
        // clear stored ID and sessions
        localStorage.removeItem('nullLink_myPeerId');
        localStorage.removeItem('nullLink_sessions');
        sessions = {};
        // clear local sessions object
        // reinitialize peer with new ID
        initPeer(true); // force fresh init
        toast("New ID generated! Share this new ID with your contacts.");
        // optionally refresh UI to show empty conversations
        renderSidebar();
        if (activeConvoId) goBack();
    }

    // ── Display name management ──
    let currentDisplayName = "";
    function loadDisplayName() {
        const stored = localStorage.getItem('nullLink_displayName');
        if (stored) currentDisplayName = stored;
        else currentDisplayName = "";
        updateDisplayNameUI();
    }
    function saveDisplayName() {
        const inputField = document.getElementById('display-name-input');
        const newName = inputField ? inputField.value.trim() : "";
        currentDisplayName = newName.substring(0, 24);
        localStorage.setItem('nullLink_displayName', currentDisplayName);
        updateDisplayNameUI();
        toast("Display name saved");
    }
    function updateDisplayNameUI() {
        const entryInput = document.getElementById('display-name-input');
        if (entryInput) entryInput.value = currentDisplayName;
        const sidebarSpan = document.getElementById('sidebar-display-name-span');
        if (sidebarSpan) sidebarSpan.textContent = currentDisplayName && currentDisplayName.length > 0 ? currentDisplayName : "—";
        const container = document.getElementById('sidebar-display-name-container');
        if (container && (!currentDisplayName || currentDisplayName.length === 0)) {
            // optional subtle style
        }
    }
    function editDisplayNameFromSidebar() {
        const newName = prompt("Enter your display name (max 24 characters):", currentDisplayName);
        if (newName !== null) {
            currentDisplayName = newName.trim().substring(0,24);
            localStorage.setItem('nullLink_displayName', currentDisplayName);
            updateDisplayNameUI();
            toast("Display name updated");
        }
    }

    // ── Initialize PeerJS (modified to allow forced restart) ──
    function initPeer(forceFresh = false) {
        if (forceFresh) {
            if (peer && !peer.destroyed) peer.destroy();
            peerReady = false;
        }
        const shortId = getOrCreatePeerId();
        document.getElementById('my-id-display').textContent = shortId;
        document.getElementById('sidebar-my-id').textContent = shortId;

        try {
            peer = new Peer(shortId, { debug: 0 });
        } catch (e) {
            console.error('PeerJS init error:', e);
            document.getElementById('my-id-display').textContent = 'error — refresh';
            document.getElementById('relay-status-text').textContent = 'relay unavailable — please refresh';
            return;
        }

        peer.on('open', function(id) {
            myId = id;
            peerReady = true;
            localStorage.setItem('nullLink_myPeerId', id);
            document.getElementById('my-id-display').textContent = myId;
            document.getElementById('sidebar-my-id').textContent = myId;
            document.getElementById('relay-dot').style.background = 'var(--green)';
            document.getElementById('relay-status-text').textContent = 'relay active · human-to-human only';
            toast('Your session ID is ready — share it with your partner');
            saveSessionsToStorage();
        });

        peer.on('connection', function(conn) {
            handleIncomingConnection(conn);
        });

        peer.on('error', function(err) {
            console.error('PeerJS error:', err);
            if (err.type === 'unavailable-id') {
                localStorage.removeItem('nullLink_myPeerId');
                peer.destroy();
                setTimeout(() => initPeer(true), 300);
                return;
            }
            if (err.type === 'peer-unavailable') toast('Peer is unreachable. They may be offline or ID incorrect.');
            if (err.type === 'network' || err.type === 'server-error') {
                document.getElementById('relay-dot').style.background = 'var(--red)';
                document.getElementById('relay-status-text').textContent = 'relay disrupted — reconnecting…';
            }
        });

        peer.on('disconnected', function() {
            document.getElementById('relay-dot').style.background = 'var(--amber)';
            document.getElementById('relay-status-text').textContent = 'relay reconnecting…';
            if (peer && !peer.destroyed) setTimeout(() => { if (peer && !peer.destroyed && !peer.disconnected) peer.reconnect(); }, 1500);
        });
    }

    // ── Incoming connection handling (enhanced for auto-reactivate) ──
    function handleIncomingConnection(conn) {
        const remotePeerId = conn.peer;
        ensureSession(remotePeerId);
        sessions[remotePeerId].conn = conn;
        sessions[remotePeerId].online = true;

        conn.on('data', function(data) { handleDataMessage(remotePeerId, data); });
        conn.on('close', function() {
            if (sessions[remotePeerId]) {
                sessions[remotePeerId].online = false;
                sessions[remotePeerId].active = false;
                if (sessions[remotePeerId].conn === conn) sessions[remotePeerId].conn = null;
            }
            saveSessionsToStorage();
            renderSidebar();
            if (activeConvoId === remotePeerId) updateHeaderStatus();
            toast('Connection with ' + remotePeerId + ' closed.');
        });
        conn.on('error', function(err) { console.error('Connection error with', remotePeerId, ':', err); });
    }

    // ── Core message handling: supports RECONNECT for previously established contacts ──
    function handleDataMessage(peerId, rawData) {
        let data;
        try { data = JSON.parse(rawData); } catch (e) { data = { type: 'CHAT', text: String(rawData), time: getTime(), from: peerId }; }

        ensureSession(peerId);
        const sess = sessions[peerId];

        // ---- RECONNECT protocol (persistent conversations after browser restart) ----
        if (data.type === 'HANDSHAKE_RECONNECT') {
            if (sess.established || (sess.messages && sess.messages.length > 0)) {
                sess.active = true;
                sess.pendingHandshake = 'none';
                sess.online = true;
                if (sess.conn && sess.conn.open) {
                    sess.conn.send(JSON.stringify({ type: 'HANDSHAKE_RECONNECT_ACCEPT', from: myId }));
                }
                saveSessionsToStorage();
                toast(`Reconnected with ${peerId} — you can now chat`);
                renderSidebar();
                if (activeConvoId === peerId) { renderMessages(); updateHeaderStatus(); }
            } else {
                // fallback: treat as normal handshake request
                sess.pendingHandshake = 'incoming';
                saveSessionsToStorage();
                renderSidebar();
                toast(`Incoming handshake from ${peerId} — accept to chat`);
            }
            return;
        }
        if (data.type === 'HANDSHAKE_RECONNECT_ACCEPT') {
            sess.active = true;
            sess.pendingHandshake = 'none';
            sess.online = true;
            sess.established = true;
            saveSessionsToStorage();
            toast(`Connection restored with ${peerId}`);
            renderSidebar();
            if (activeConvoId === peerId) { renderMessages(); updateHeaderStatus(); }
            return;
        }

        // Standard handshake flow
        if (data.type === 'HANDSHAKE_REQUEST') {
            const requesterId = data.from || peerId;
            if (sessions[requesterId] && sessions[requesterId].established) {
                // Auto-accept if previously established
                if (sessions[requesterId].conn && sessions[requesterId].conn.open) {
                    sessions[requesterId].conn.send(JSON.stringify({ type: 'HANDSHAKE_ACCEPT', from: myId }));
                }
                sessions[requesterId].active = true;
                sessions[requesterId].pendingHandshake = 'none';
                saveSessionsToStorage();
                renderSidebar();
                if (activeConvoId === requesterId) updateHeaderStatus();
                return;
            }
            const sessReq = ensureSession(requesterId);
            sessReq.pendingHandshake = 'incoming';
            sessReq.online = true;
            toast('Incoming handshake request from ' + requesterId + ' — accept to start chatting');
            saveSessionsToStorage();
            renderSidebar();
            showAppIfNeeded();
        } 
        else if (data.type === 'HANDSHAKE_ACCEPT') {
            const accepterId = data.from || peerId;
            const s = ensureSession(accepterId);
            s.active = true;
            s.pendingHandshake = 'none';
            s.established = true;
            s.online = true;
            toast('Connection established with ' + accepterId + ' — you can now chat');
            saveSessionsToStorage();
            renderSidebar();
            showAppIfNeeded();
            openConvo(accepterId);
        } 
        else if (data.type === 'CHAT') {
            const senderId = data.from || peerId;
            const s = ensureSession(senderId);
            if (!s.active && s.established) s.active = true; // reactivate if established
            if (!s.active) { s.active = true; s.pendingHandshake = 'none'; }
            s.messages.push({ dir: 'in', text: data.text, time: data.time || getTime(), status: 'delivered', type: 'text' });
            s.online = true;
            saveSessionsToStorage();
            renderSidebar();
            if (activeConvoId === senderId) renderMessages();
            showAppIfNeeded();
        }
    }

    function ensureSession(peerId) {
        if (!sessions[peerId]) {
            sessions[peerId] = {
                id: peerId,
                conn: null,
                online: false,
                active: false,
                established: false,
                messages: [],
                pendingHandshake: 'none',
            };
            saveSessionsToStorage();
        }
        return sessions[peerId];
    }

    function showAppIfNeeded() {
        const appEl = document.getElementById('app');
        const entryEl = document.getElementById('entry');
        if (appEl.style.display === 'none' || !appEl.style.display) {
            entryEl.style.display = 'none';
            appEl.style.display = 'flex';
        }
    }

    // ── RE-ESTABLISH connection for previous contact (auto-reconnect) ──
    function reconnectToPeer(peerId) {
        return new Promise((resolve, reject) => {
            if (reconnectingFlags[peerId]) { toast('Already reconnecting...'); reject(); return; }
            const sess = sessions[peerId];
            if (!sess || !sess.established) { reject(); return; }
            if (sess.active && sess.conn && sess.conn.open) { resolve(true); return; }
            reconnectingFlags[peerId] = true;
            toast(`Reconnecting to ${peerId} ...`);
            let conn;
            try { conn = peer.connect(peerId, { reliable: true }); } catch(e) { delete reconnectingFlags[peerId]; reject(e); return; }
            sess.conn = conn;
            const timeout = setTimeout(() => {
                delete reconnectingFlags[peerId];
                reject(new Error('timeout'));
            }, 8000);
            conn.on('open', () => {
                clearTimeout(timeout);
                conn.send(JSON.stringify({ type: 'HANDSHAKE_RECONNECT', from: myId }));
                sess.pendingHandshake = 'none';
                sess.online = true;
                // Wait for ACCEPT or mark active after response (handled in handleDataMessage)
                saveSessionsToStorage();
                renderSidebar();
                delete reconnectingFlags[peerId];
                resolve(true);
            });
            conn.on('error', (err) => {
                clearTimeout(timeout);
                delete reconnectingFlags[peerId];
                reject(err);
            });
            conn.on('data', (data) => handleDataMessage(peerId, data));
        });
    }

    // ── Send connection request (unchanged) ──
    function sendConnectionRequest() {
        if (!peerReady || !peer || peer.destroyed) { toast('Relay not ready — please wait'); return; }
        const input = document.getElementById('connect-input');
        let remoteId = input.value.trim();
        if (!remoteId) { toast('Enter peer session ID'); return; }
        if (remoteId === myId) { toast('Cannot connect to yourself'); return; }
        const sess = ensureSession(remoteId);
        if (sess.active) { toast('Already connected with ' + remoteId); return; }
        if (sess.pendingHandshake === 'outgoing') { toast('Request already pending — waiting for acceptance'); return; }
        sess.pendingHandshake = 'outgoing';
        sess.online = true;
        saveSessionsToStorage();
        let conn;
        try { conn = peer.connect(remoteId, { reliable: true }); } catch(e) { sess.pendingHandshake = 'none'; saveSessionsToStorage(); toast('Failed to initiate connection.'); return; }
        sess.conn = conn;
        conn.on('open', function() {
            conn.send(JSON.stringify({ type: 'HANDSHAKE_REQUEST', from: myId, timestamp: Date.now() }));
            toast('Handshake request sent to ' + remoteId + '. Waiting for them to accept.');
            sess.online = true;
            saveSessionsToStorage();
            renderSidebar();
            showAppIfNeeded();
        });
        conn.on('data', function(data) { handleDataMessage(remoteId, data); });
        conn.on('close', function() { if (sessions[remoteId]) { sessions[remoteId].online = false; if (!sessions[remoteId].active) sessions[remoteId].pendingHandshake = 'none'; } saveSessionsToStorage(); renderSidebar(); if (activeConvoId === remoteId) updateHeaderStatus(); });
        conn.on('error', function() { if (sessions[remoteId] && !sessions[remoteId].active) { sessions[remoteId].pendingHandshake = 'none'; sessions[remoteId].online = false; } saveSessionsToStorage(); toast('Could not reach ' + remoteId); renderSidebar(); });
        renderSidebar();
        showAppIfNeeded();
        document.getElementById('connect-input').value = '';
    }

    function acceptConnection(peerId) {
        const sess = sessions[peerId];
        if (!sess || sess.pendingHandshake !== 'incoming') { toast('No pending request to accept'); return; }
        sess.active = true;
        sess.established = true;
        sess.pendingHandshake = 'none';
        sess.online = true;
        saveSessionsToStorage();
        if (sess.conn && sess.conn.open) sess.conn.send(JSON.stringify({ type: 'HANDSHAKE_ACCEPT', from: myId }));
        toast('Connection established with ' + peerId + ' — you can now chat');
        renderSidebar();
        showAppIfNeeded();
        openConvo(peerId);
    }

    function openNewConnectionPrompt() {
        if (!peerReady || !peer || peer.destroyed) { toast('Relay not ready — please wait'); return; }
        const id = prompt('Enter peer session ID to request connection (mutual handshake required):');
        if (!id || id === myId) { if(id===myId) toast('Cannot request self'); return; }
        const remoteId = id.trim();
        const sess = ensureSession(remoteId);
        if (sess.active) { toast('Already connected'); return; }
        sess.pendingHandshake = 'outgoing';
        sess.online = true;
        saveSessionsToStorage();
        let conn;
        try { conn = peer.connect(remoteId, { reliable: true }); } catch(e) { sess.pendingHandshake = 'none'; saveSessionsToStorage(); toast('Failed to initiate connection.'); return; }
        sess.conn = conn;
        conn.on('open', function() { conn.send(JSON.stringify({ type: 'HANDSHAKE_REQUEST', from: myId })); toast('Handshake request sent to ' + remoteId); saveSessionsToStorage(); renderSidebar(); });
        conn.on('data', function(data) { handleDataMessage(remoteId, data); });
        conn.on('close', function() { if (sessions[remoteId]) { sessions[remoteId].online = false; if (!sessions[remoteId].active) sessions[remoteId].pendingHandshake = 'none'; } saveSessionsToStorage(); renderSidebar(); if (activeConvoId === remoteId) updateHeaderStatus(); });
        conn.on('error', function() { if (sessions[remoteId] && !sessions[remoteId].active) { sessions[remoteId].pendingHandshake = 'none'; sessions[remoteId].online = false; } saveSessionsToStorage(); toast('Could not reach ' + remoteId); renderSidebar(); });
        renderSidebar();
        showAppIfNeeded();
    }

    function restorePreviousConversations() {
        showAppIfNeeded();
        renderSidebar();
    }

    // ── Render sidebar (with reconnect trigger on conversation click) ──
    function renderSidebar() {
        const container = document.getElementById('convos-list');
        if (!container) return;
        container.innerHTML = '';
        const sessionsList = Object.values(sessions);
        sessionsList.sort((a, b) => {
            const order = (s) => { if (s.active) return 0; if (s.pendingHandshake === 'incoming') return 1; if (s.pendingHandshake === 'outgoing') return 2; return 3; };
            return order(a) - order(b);
        });
        for (const sess of sessionsList) {
            if (!sess.id || sess.id === myId) continue;
            const pendingType = sess.pendingHandshake;
            const lastMsg = sess.messages.length ? sess.messages[sess.messages.length - 1] : null;
            let preview = '';
            if (lastMsg) preview = lastMsg.text ? lastMsg.text.substring(0, 28) : '[media]';
            else if (pendingType === 'incoming') preview = '⏳ connection request';
            else if (pendingType === 'outgoing') preview = 'request pending…';
            else preview = 'no messages';
            const unread = sess.messages.filter(m => m.dir === 'in' && m.status !== 'seen').length;
            const div = document.createElement('div');
            div.className = 'convo-item' + (activeConvoId === sess.id ? ' active' : '');
            div.innerHTML = `<div class="convo-avatar">${escapeHtml(sess.id.slice(-4))}<div class="status-pip ${sess.online ? 'pip-online' : 'pip-offline'}"></div></div>
                <div class="convo-info"><div class="convo-id">${escapeHtml(sess.id)}</div><div class="convo-preview">${escapeHtml(preview.substring(0, 28))}</div></div>
                <div class="convo-meta"><div class="convo-time">${lastMsg ? lastMsg.time : ''}</div>${unread ? `<div class="unread-badge">${unread}</div>` : ''}
                ${pendingType === 'incoming' ? `<button class="accept-request-btn" data-peer="${escapeHtml(sess.id)}" style="margin-top:6px;">✓ accept</button>` : ''}
                ${pendingType === 'outgoing' ? `<span class="action-pending" style="font-size:9px;padding:2px 6px;">↻ pending</span>` : ''}</div>`;
            div.addEventListener('click', (e) => { if (e.target.classList && e.target.classList.contains('accept-request-btn')) return; openConvo(sess.id); });
            const acceptBtn = div.querySelector('.accept-request-btn');
            if (acceptBtn) acceptBtn.addEventListener('click', (e) => { e.stopPropagation(); acceptConnection(sess.id); });
            container.appendChild(div);
        }
    }

    // ── Open conversation: trigger auto-reconnect if needed (persistent resume) ──
    async function openConvo(peerId) {
        const sess = sessions[peerId];
        if (!sess) return;
        if (!sess.active && sess.established && !sess.pendingHandshake) {
            try { await reconnectToPeer(peerId); } catch(e) { toast(`Could not reconnect to ${peerId} — they might be offline`); }
        }
        activeConvoId = peerId;
        document.getElementById('empty-main').style.display = 'none';
        document.getElementById('chat-panel').style.display = 'flex';
        document.getElementById('header-id').textContent = peerId;
        updateHeaderStatus();
        document.getElementById('header-avatar').innerHTML = escapeHtml(peerId.slice(-4)) + '<div style="position:absolute;bottom:-2px;right:-2px;width:8px;height:8px;border-radius:50%;border:1.5px solid var(--bg2);background:' + (sess.online ? 'var(--green)' : 'var(--text3)') + '"></div>';
        renderMessages();
        if (sess.messages) sess.messages.forEach(m => { if (m.dir === 'in') m.status = 'seen'; });
        saveSessionsToStorage();
        renderSidebar();
    }

    function updateHeaderStatus() {
        if (!activeConvoId) return;
        const sess = sessions[activeConvoId];
        const statusEl = document.getElementById('header-status');
        if (sess && sess.active) { statusEl.textContent = sess.online ? 'connected · online' : 'offline'; statusEl.style.color = sess.online ? 'var(--green)' : 'var(--text3)'; }
        else if (sess && sess.pendingHandshake === 'incoming') { statusEl.textContent = 'handshake required'; statusEl.style.color = 'var(--amber)'; }
        else { statusEl.textContent = 'history · click to reconnect'; statusEl.style.color = 'var(--text3)'; }
    }

    function renderMessages() {
        const sess = sessions[activeConvoId];
        const msgsDiv = document.getElementById('messages');
        msgsDiv.innerHTML = '<div class="day-label">today</div>';
        if (!sess || !sess.messages) return;
        sess.messages.forEach(msg => {
            const row = document.createElement('div');
            row.className = 'msg-row ' + msg.dir;
            let ticks = '';
            if (msg.dir === 'out') { if (msg.status === 'sent') ticks = '<span>✓</span>'; else if (msg.status === 'delivered') ticks = '<span>✓✓</span>'; else if (msg.status === 'seen') ticks = '<span style="color:var(--accent)">✓✓</span>'; }
            row.innerHTML = `<div style="display:flex;flex-direction:column;align-items:${msg.dir === 'out' ? 'flex-end' : 'flex-start'};max-width:78%;"><div class="msg-bubble">${escapeHtml(msg.text || '')}</div><div class="msg-meta">${msg.time} ${ticks}</div></div>`;
            msgsDiv.appendChild(row);
        });
        msgsDiv.scrollTop = msgsDiv.scrollHeight;
    }

    // ── Send message (if session inactive but established, trigger reconnect first) ──
    async function sendMessage() {
        const inp = document.getElementById('msg-input');
        const text = inp.value.trim();
        if (!text || !activeConvoId) return;
        const sess = sessions[activeConvoId];
        if (!sess) return;
        if (!sess.active && sess.established) {
            toast('Reconnecting before sending...');
            try { await reconnectToPeer(activeConvoId); } catch(e) { toast('Cannot send: peer offline. Try again later.'); return; }
        }
        if (!sess.active) { toast('Session not active — please wait for reconnection'); return; }
        if (!sess.conn || !sess.conn.open) { toast('Connection lost — reconnecting'); reconnectToPeer(activeConvoId).catch(()=>toast('Offline')); return; }
        const now = getTime();
        const messageObj = { dir: 'out', text: text, time: now, status: 'sent', type: 'text' };
        sess.messages.push(messageObj);
        saveSessionsToStorage();
        renderMessages();
        renderSidebar();
        inp.value = '';
        autoResize(inp);
        try {
            sess.conn.send(JSON.stringify({ type: 'CHAT', text: text, time: now, from: myId }));
            setTimeout(() => { const last = sess.messages[sess.messages.length-1]; if (last && last.dir === 'out' && last.status === 'sent') { last.status = 'delivered'; saveSessionsToStorage(); renderMessages(); } }, 150);
        } catch(e) { toast('Failed to send — connection may be broken'); }
    }

    function goBack() { document.getElementById('chat-panel').style.display = 'none'; document.getElementById('empty-main').style.display = 'flex'; activeConvoId = null; renderSidebar(); }
    function copyMyId() { if (!myId) { toast('ID not ready'); return; } navigator.clipboard.writeText(myId).then(()=>toast('Copied: '+myId)).catch(()=>{ const tmp=document.createElement('input'); tmp.value=myId; document.body.appendChild(tmp); tmp.select(); document.execCommand('copy'); document.body.removeChild(tmp); toast('Copied: '+myId); }); }
    function autoResize(el) { el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight, 100) + 'px'; }
    function getTime() { const d = new Date(); return d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0'); }
    function toast(msg) { const t = document.getElementById('toast'); if (!t) return; t.textContent = msg; t.classList.add('show'); clearTimeout(t._tid); t._tid = setTimeout(()=>t.classList.remove('show'), 2200); }
    function escapeHtml(s) { return String(s).replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])); }
    function healthCheck() { if (!peer || peer.destroyed || !peerReady) return; Object.keys(sessions).forEach(pid => { const s = sessions[pid]; if (s && s.conn) s.online = s.conn.open; }); saveSessionsToStorage(); renderSidebar(); if (activeConvoId) updateHeaderStatus(); const dot = document.getElementById('relay-dot'); const statusText = document.getElementById('relay-status-text'); if (dot && statusText && peerReady && peer && !peer.destroyed && !peer.disconnected) { dot.style.background = 'var(--green)'; statusText.textContent = 'relay active · human-to-human only'; } }
    function bootstrap() { document.getElementById('app').style.display = 'none'; document.getElementById('entry').style.display = 'flex'; loadSessionsFromStorage(); loadDisplayName(); initPeer(); setInterval(healthCheck, 8000); }
    bootstrap();
</script>
